<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fino — 法律文件</title>
<meta name="description" content="Fino 記帳 App 的隱私政策與帳號資料刪除說明。">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1b1b1f;
    --muted: #5c5f66;
    --line: #e2e4e8;
    --accent: #1d5c46;
    --box-bg: #f5f7f6;
    --warn-bg: #fff8e8;
    --warn-line: #e0c179;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181b;
      --fg: #e6e7e9;
      --muted: #a2a6ad;
      --line: #2e3237;
      --accent: #7fd2b1;
      --box-bg: #1e2125;
      --warn-bg: #2a2419;
      --warn-line: #6d5a2c;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
                 "PingFang TC", "Microsoft JhengHei", Roboto, Helvetica, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.75;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 18px 20px 80px;
  }
  h1 {
    font-size: 1.85rem;
    line-height: 1.3;
    margin: 0 0 6px;
  }
  h2 {
    font-size: 1.3rem;
    line-height: 1.35;
    margin: 2.6em 0 0.6em;
    padding-top: 0.5em;
    border-top: 1px solid var(--line);
  }
  h3 {
    font-size: 1.05rem;
    margin: 1.8em 0 0.4em;
  }
  p, ul, ol { margin: 0.7em 0; }
  ul, ol { padding-left: 1.4em; }
  li { margin: 0.35em 0; }
  a { color: var(--accent); }
  a:hover { text-decoration: none; }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.88em;
    background: var(--box-bg);
    padding: 0.1em 0.35em;
    border-radius: 4px;
    word-break: break-all;
  }
  .meta {
    color: var(--muted);
    font-size: 0.92rem;
    margin: 0 0 1.4em;
  }
  /* 強調框：.summary 一般，.note 警示 */
  .summary {
    background: var(--box-bg);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    padding: 14px 18px;
    margin: 1.4em 0;
  }
  .note {
    background: var(--warn-bg);
    border: 1px solid var(--warn-line);
    border-radius: 6px;
    padding: 14px 18px;
    margin: 1.4em 0;
  }
  .summary > :first-child, .note > :first-child { margin-top: 0; }
  .summary > :last-child, .note > :last-child { margin-bottom: 0; }
  .tablescroll {
    overflow-x: auto;
    margin: 1.2em 0;
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 0.94rem;
    min-width: 480px;
  }
  th, td {
    text-align: left;
    vertical-align: top;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
  }
  th {
    background: var(--box-bg);
    font-weight: 600;
  }
  tr:last-child td { border-bottom: none; }
  /* 首頁的文件連結卡片 */
  .links {
    list-style: none;
    padding: 0;
    margin: 0 0 8px;
  }
  .links li { margin: 0 0 10px; }
  .links a {
    display: block;
    background: var(--box-bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    text-decoration: none;
    font-weight: 600;
  }
  .links a:hover { border-color: var(--accent); }
  .links span {
    display: block;
    font-weight: 400;
    font-size: 0.9rem;
    color: var(--muted);
  }
  .top {
    display: inline-block;
    margin-top: 2.5em;
    font-size: 0.9rem;
  }
  /* 頂部導覽：麵包屑 + 語言切換 */
  .topnav {
    position: sticky;
    top: 0;
    z-index: 10;
    /* 捲動時內容會從底下經過，必須是不透明的 */
    background: var(--bg);
    display: flex;
    flex-wrap: wrap;
    gap: 10px 16px;
    align-items: baseline;
    justify-content: space-between;
    margin: 0 0 14px;
    padding: 14px 0 16px;
    border-bottom: 1px solid var(--line);
    font-size: 0.92rem;
  }
  .topnav p { margin: 0; }
  .crumb { color: var(--muted); }
  .crumb a { text-decoration: none; font-weight: 600; }
  .crumb [aria-current] { color: var(--fg); }
  .langswitch { display: flex; gap: 8px; }
  .langswitch a {
    display: inline-block;
    padding: 4px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    text-decoration: none;
    color: var(--muted);
  }
  .langswitch a:hover { border-color: var(--accent); }
  .langswitch a[aria-current="page"] {
    background: var(--box-bg);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
    cursor: default;
  }
  .peer { margin: 0 0 26px; font-size: 0.92rem; }
  .peer a { text-decoration: none; }
  .peer a:hover { text-decoration: underline; }
  /* 章節目錄 */
  .toc {
    background: var(--box-bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px 18px;
    margin: 1.6em 0 2.2em;
  }
  .toc-title {
    margin: 0 0 10px;
    font-weight: 700;
    font-size: 0.92rem;
    color: var(--muted);
  }
  .toc ul {
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .toc li { margin: 5px 0; }
  .toc a { text-decoration: none; }
  .toc a:hover { text-decoration: underline; }
  /* 錨點跳轉時避開固定導覽列的高度 */
  h2[id] { scroll-margin-top: 72px; }
  footer {
    margin-top: 3.5em;
    padding-top: 1.2em;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 0.88rem;
  }
</style>
</head>
<body>
<div class="wrap">

<nav class="topnav" aria-label="Navigation">
  <p class="crumb"><span aria-current="page">Fino</span></p>
  <p class="langswitch"><a href="#" aria-current="page">繁體中文</a><a href="en/index.html">English</a></p>
</nav>

</body>
</html>
